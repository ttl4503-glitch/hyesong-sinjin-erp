<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공사현황관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#f2efe6;
    --paper-dark:#e8e3d4;
    --ink:#1c2a2e;
    --blueprint:#1b3a4b;
    --blueprint-light:#2f5872;
    --hyesong:#c96a1f;
    --hyesong-bg:#f6e3d1;
    --sinjin:#4f7a52;
    --sinjin-bg:#dfe9dd;
    --danger:#b83b3b;
    --line:#c9c2ad;
    --mono: 'Roboto Mono', 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0;
    background:var(--paper);
    font-family:var(--sans);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--paper); position:relative;}

  /* Header */
  .topbar{
    background:var(--blueprint);
    color:#eef3f4;
    padding:18px 16px 0 16px;
    position:sticky; top:0; z-index:20;
    border-bottom:3px solid var(--blueprint-light);
  }
  .topbar h1{
    font-size:15px; letter-spacing:2px; font-weight:600;
    margin:0 0 14px 0; text-transform:uppercase; opacity:.85;
  }
  .topbar h1 span{color:#8fb9c9;}
  .tabs{display:flex; gap:0;}
  .tab{
    flex:1; text-align:center; padding:10px 4px 12px 4px;
    font-size:14px; font-weight:600; color:#a9c2c9;
    border-bottom:3px solid transparent; cursor:pointer;
    transition:.15s;
  }
  .tab.active{color:#fff; border-bottom-color:var(--hyesong);}
  .tab[data-c="신진조경"].active{border-bottom-color:var(--sinjin);}

  /* Dashboard */
  .dash{
    display:flex; gap:8px; padding:14px 16px 6px 16px;
  }
  .dcard{
    flex:1; background:#fff; border:1px solid var(--line);
    border-radius:6px; padding:10px 10px;
  }
  .dcard .num{font-family:var(--mono); font-size:20px; font-weight:700; line-height:1;}
  .dcard .lbl{font-size:11px; color:#6b6455; margin-top:4px;}

  /* Section label */
  .section-label{
    padding:16px 16px 6px 16px; font-size:12px; letter-spacing:1px;
    color:#8a8371; text-transform:uppercase; display:flex; justify-content:space-between; align-items:center;
  }
  .export-btn{
    background:none; border:1px solid var(--blueprint); color:var(--blueprint);
    font-size:11px; font-weight:700; padding:5px 9px; border-radius:5px; cursor:pointer;
    text-transform:none; letter-spacing:0;
  }
  .export-btn:active{background:var(--blueprint); color:#fff;}

  /* Project list */
  .list{padding:0 16px 90px 16px; display:flex; flex-direction:column; gap:10px;}
  .empty{
    text-align:center; padding:40px 20px; color:#8a8371; font-size:13px;
    border:1px dashed var(--line); border-radius:8px; margin:10px 16px;
  }
  .card{
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:14px; cursor:pointer; transition:.15s; position:relative;
  }
  .card:active{transform:scale(.99);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .card-title{font-size:15px; font-weight:700;}
  .card-loc{font-size:12px; color:#6b6455; margin-top:2px;}
  .tag{
    font-size:10px; font-weight:700; padding:3px 7px; border-radius:4px;
    white-space:nowrap;
  }
  .tag.hyesong{background:var(--hyesong-bg); color:var(--hyesong);}
  .tag.sinjin{background:var(--sinjin-bg); color:var(--sinjin);}

  /* gauge / ruler progress bar - signature element */
  .gauge{margin-top:12px;}
  .gauge-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;}
  .gauge-pct{font-family:var(--mono); font-size:18px; font-weight:700;}
  .gauge-period{font-size:11px; color:#8a8371; font-family:var(--mono);}
  .ruler{
    position:relative; height:14px; background:var(--paper-dark);
    border-radius:2px; overflow:hidden; border:1px solid var(--line);
  }
  .ruler-fill{
    position:absolute; left:0; top:0; bottom:0;
    background:repeating-linear-gradient(90deg, var(--blueprint) 0 6px, var(--blueprint-light) 6px 8px);
  }
  .ruler-fill.late{background:repeating-linear-gradient(90deg, var(--danger) 0 6px, #c95a5a 6px 8px);}
  .ruler-ticks{position:absolute; inset:0; display:flex;}
  .ruler-ticks div{flex:1; border-right:1px solid rgba(0,0,0,.06);}
  .status-row{display:flex; justify-content:space-between; margin-top:8px; font-size:11px; color:#8a8371;}
  .status-row .dday.late{color:var(--danger); font-weight:700;}

  /* Floating add button */
  .fab{
    position:fixed; left:50%; transform:translateX(-50%); bottom:20px;
    max-width:520px; width:calc(100% - 32px); z-index:15;
  }
  .fab button{
    width:100%; padding:14px; border:none; border-radius:8px;
    background:var(--blueprint); color:#fff; font-size:14px; font-weight:700;
    letter-spacing:.5px; box-shadow:0 4px 14px rgba(27,58,75,.35); cursor:pointer;
  }
  .fab button:active{background:var(--blueprint-light);}

  /* Modal / detail panel */
  .overlay{
    position:fixed; inset:0; background:rgba(20,26,24,.55); z-index:30;
    display:none; align-items:flex-end;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--paper); width:100%; max-width:520px; margin:0 auto;
    border-radius:16px 16px 0 0; max-height:90vh; overflow-y:auto;
    padding:20px 18px 26px 18px; animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 16px auto;}
  .sheet h2{font-size:18px; margin:0 0 14px 0;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:#6b6455; margin-bottom:5px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:6px;
    font-size:14px; background:#fff; font-family:var(--sans); color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:50px;}
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}
  .slider-row{display:flex; align-items:center; gap:10px;}
  .slider-row input[type=range]{flex:1;}
  .slider-val{font-family:var(--mono); font-weight:700; width:44px; text-align:right;}

  .btn-primary{
    width:100%; padding:13px; border:none; border-radius:8px; background:var(--blueprint);
    color:#fff; font-weight:700; font-size:14px; cursor:pointer; margin-top:6px;
  }
  .btn-danger{
    width:100%; padding:11px; border:1px solid var(--danger); border-radius:8px; background:none;
    color:var(--danger); font-weight:600; font-size:13px; cursor:pointer; margin-top:8px;
  }
  .btn-ghost{
    width:100%; padding:11px; border:1px solid var(--line); border-radius:8px; background:#fff;
    color:var(--ink); font-weight:600; font-size:13px; cursor:pointer; margin-top:8px;
  }

  /* milestones */
  .ms-title{font-size:13px; font-weight:700; margin:18px 0 8px 0; color:#6b6455; text-transform:uppercase; letter-spacing:.5px;}
  .ms-item{
    display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);
  }
  .ms-check{
    width:20px; height:20px; border-radius:5px; border:2px solid var(--blueprint); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; color:#fff;
  }
  .ms-check.done{background:var(--blueprint);}
  .ms-body{flex:1;}
  .ms-name{font-size:13px; font-weight:600;}
  .ms-name.done{text-decoration:line-through; color:#a09a89;}
  .ms-date{font-size:11px; color:#8a8371; font-family:var(--mono);}
  .ms-del{color:#b0a996; font-size:16px; padding:4px 6px; cursor:pointer;}
  .ms-add{display:flex; gap:8px; margin-top:10px;}
  .ms-add input{flex:1;}
  .ms-add button{
    padding:0 14px; border:none; border-radius:6px; background:var(--blueprint); color:#fff; font-weight:700; cursor:pointer;
  }
  .loading{text-align:center; padding:40px; color:#8a8371; font-size:13px;}

  /* today summary strip */
  .today-strip{
    margin:0 16px 4px 16px; padding:10px 14px; background:var(--blueprint); color:#eef3f4;
    border-radius:6px; font-size:12px; display:flex; justify-content:space-between; align-items:center;
  }
  .today-strip b{font-family:var(--mono); font-size:14px;}

  /* labor/equipment logs */
  .lg-stats{display:flex; gap:8px; margin:2px 0 14px 0;}
  .lg-stat{flex:1; background:#fff; border:1px solid var(--line); border-radius:6px; padding:8px 10px; text-align:center;}
  .lg-stat .n{font-family:var(--mono); font-size:16px; font-weight:700;}
  .lg-stat .l{font-size:10px; color:#8a8371; margin-top:2px;}
  .lg-item{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
  .lg-edit{color:#8a8371; font-size:14px; padding:4px 6px; cursor:pointer;}
  .lg-del{color:#b0a996; font-size:16px; padding:4px 6px; cursor:pointer;}
  .lg-sum{font-size:12px; color:#6b6455; font-family:var(--mono); margin:6px 2px 0 2px; text-align:right;}
  .lg-cancel{font-size:11px; color:#8a8371; text-decoration:underline; cursor:pointer; margin-left:6px;}
  .lg-type{
    font-size:10px; font-weight:700; padding:4px 6px; border-radius:4px; flex-shrink:0; min-width:30px; text-align:center;
  }
  .lg-type.person{background:var(--blueprint-light); color:#fff;}
  .lg-type.equip{background:var(--hyesong); color:#fff;}
  .lg-type.material{background:var(--sinjin); color:#fff;}
  .lg-type.meal{background:#a67c3d; color:#fff;}
  .lg-type.misc{background:#7d7360; color:#fff;}
  .tax-badge{
    font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; margin-left:4px; display:inline-block;
  }
  .tax-badge.issued{background:#dfe9dd; color:var(--sinjin);}
  .tax-badge.pending{background:#f3e0d6; color:var(--danger);}
  .lg-body{flex:1;}
  .lg-name{font-size:13px; font-weight:600;}
  .lg-sub{font-size:11px; color:#8a8371; font-family:var(--mono);}
  .lg-add{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .lg-add select{max-width:70px;}
  .lg-add select.lg-workitem-select{max-width:120px;}
  .lg-add input[type=date]{max-width:118px;}
  .lg-add input[type=text].lg-name-input{flex:1; min-width:90px;}
  .lg-add input[type=text].lg-jobtype-input{max-width:100px;}
  .lg-add input[type=text].lg-unit-input{max-width:56px;}
  .lg-add input[type=text].lg-note-input{flex:1; min-width:80px;}
  .lg-add input[type=number]{max-width:64px;}
  .lg-add input[type=number].lg-rate-input{max-width:90px;}
  .lg-add input[type=number].lg-amount-input{max-width:100px;}
  .lg-add button{
    padding:0 14px; border:none; border-radius:6px; background:var(--blueprint); color:#fff; font-weight:700; cursor:pointer;
  }
  .lg-tax-row{
    display:flex; align-items:center; gap:6px; width:100%; margin-top:2px; font-size:12px; color:#6b6455;
  }
  .lg-tax-row input{width:16px; height:16px;}

  /* BOQ / daily report */
  .progress-auto-display{
    font-family:var(--mono); font-size:20px; font-weight:700; background:#fff;
    border:1px solid var(--line); border-radius:6px; padding:10px 12px; text-align:center;
  }
  .progress-auto-sub{font-size:11px; color:#8a8371; text-align:center; margin-top:4px; font-family:var(--mono);}
  .boq-box{background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px;}
  .boq-empty{font-size:12px; color:#8a8371; margin-bottom:8px;}
  .boq-summary{font-size:13px; margin-bottom:8px;}
  .boq-summary b{font-family:var(--mono);}
  .boq-upload-btn{
    padding:9px 12px; border:1px solid var(--blueprint); border-radius:6px; background:none;
    color:var(--blueprint); font-weight:700; font-size:12px; cursor:pointer;
  }
  .boq-details{margin-top:8px; font-size:12px;}
  .boq-details summary{cursor:pointer; color:var(--blueprint-light); font-weight:600; margin-bottom:6px;}
  .boq-item-row{display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--paper-dark); gap:6px;}
  .boq-item-row .n{flex:1; color:var(--ink);}
  .boq-item-row .v{color:#6b6455; font-family:var(--mono); white-space:nowrap;}
  .dr-add{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .dr-add select{flex:1; min-width:110px; padding:9px; border:1px solid var(--line); border-radius:6px; font-size:13px;}
  .dr-add input[type=date]{max-width:118px; padding:9px; border:1px solid var(--line); border-radius:6px;}
  .dr-add input[type=number]{max-width:80px; padding:9px; border:1px solid var(--line); border-radius:6px;}
  .dr-add input[type=text]{flex:1; min-width:80px; padding:9px; border:1px solid var(--line); border-radius:6px;}
  .dr-add button{padding:0 14px; border:none; border-radius:6px; background:var(--blueprint); color:#fff; font-weight:700; cursor:pointer;}
  .dr-item{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
  .dr-body{flex:1;}
  .dr-name{font-size:13px; font-weight:600;}
  .dr-sub{font-size:11px; color:#8a8371; font-family:var(--mono);}
  .dr-del{color:#b0a996; font-size:16px; padding:4px 6px; cursor:pointer;}

  /* 착공내역서 / 공종별 진행률 */
  .wi-box{background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px;}
  .wi-empty{font-size:12px; color:#8a8371; margin-bottom:8px;}
  .wi-summary{font-size:13px; margin-bottom:8px;}
  .wi-summary b{font-family:var(--mono);}
  .wi-upload-btn{
    padding:9px 12px; border:1px solid var(--blueprint); border-radius:6px; background:none;
    color:var(--blueprint); font-weight:700; font-size:12px; cursor:pointer;
  }
  .wi-item{padding:9px 0; border-bottom:1px solid var(--line);}
  .wi-item-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; gap:6px;}
  .wi-item-name{font-size:13px; font-weight:600;}
  .wi-item-pct{font-family:var(--mono); font-size:13px; font-weight:700; white-space:nowrap;}
  .wi-bar{position:relative; height:8px; background:var(--paper-dark); border-radius:2px; overflow:hidden; border:1px solid var(--line);}
  .wi-bar-fill{position:absolute; left:0; top:0; bottom:0; background:var(--sinjin);}
  .wi-bar-fill.over{background:var(--danger);}
  .wi-item-sub{font-size:11px; color:#8a8371; font-family:var(--mono); margin-top:4px;}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="topbar">
    <h1>혜송·신진 <span>공사현황관리</span></h1>
    <div class="tabs">
      <div class="tab active" data-c="혜송산업개발">혜송산업개발</div>
      <div class="tab" data-c="신진조경">신진조경</div>
    </div>
    <div style="font-size:10px; color:#8fb9c9; padding:6px 0 10px 0;">⚠️ 이 화면을 여는 모든 사람이 같은 데이터를 함께 보고 수정해요</div>
  </div>

  <div class="dash" id="dash"></div>
  <div class="today-strip" id="todayStrip"></div>
  <div style="padding:10px 16px 0 16px;">
    <button class="export-btn" id="exportBtn" style="width:100%; padding:10px;">📊 인력·장비 월별 집계 엑셀 다운로드</button>
  </div>

  <div class="section-label">
    <span>진행 중인 공사</span>
    <span id="countLabel"></span>
  </div>

  <div class="list" id="list"><div class="loading">불러오는 중...</div></div>

  <div class="fab"><button id="addBtn">+ 공사 등록</button></div>
</div>

<!-- Add/Edit project sheet -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const COMPANIES = ["혜송산업개발","신진조경"];
let state = { company:"혜송산업개발", projects:[] };
let editingId = null;

function uid(){ return 'p'+Date.now()+Math.random().toString(36).slice(2,7); }

async function loadProjects(){
  try{
    const res = await window.storage.get('projects', true);
    state.projects = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    state.projects = [];
  }
  state.projects.forEach(p=>{ p.laborLogs = p.laborLogs || []; p.milestones = p.milestones || []; p.boq = p.boq || []; p.dailyReports = p.dailyReports || []; p.boqTotal = p.boqTotal || 0; p.workItems = p.workItems || []; p.workItemsTotal = p.workItemsTotal || 0; });
  render();
}

async function saveProjects(){
  try{
    await window.storage.set('projects', JSON.stringify(state.projects), true);
  }catch(e){
    console.error('저장 실패', e);
  }
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}

function fmtDate(d){ return d || '-'; }

function render(){
  renderDash();
  renderTodayStrip();
  renderList();
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.c===state.company);
  });
}

function renderTodayStrip(){
  const today = todayStr();
  const list = state.projects.filter(p=>p.company===state.company);
  let personCount = 0, equipCount = 0, costTotal = 0;
  list.forEach(p=>{
    (p.laborLogs||[]).forEach(l=>{
      if(l.date===today){
        const q = Number(l.qty)||0;
        if(l.type==='인력') personCount += q;
        else if(l.type==='장비') equipCount += q;
        costTotal += Number(l.amount)||0;
      }
    });
  });
  document.getElementById('todayStrip').innerHTML =
    `<span>오늘(${today}) 전체 현장 투입</span><span><b>인력 ${personCount}공수</b> · <b>장비 ${equipCount}공수</b> · <b>비용 ${formatWon(costTotal)}원</b></span>`;
}

function formatWon(n){
  return Number(n||0).toLocaleString('ko-KR');
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function renderDash(){
  const list = state.projects.filter(p=>p.company===state.company);
  const total = list.length;
  const avg = total ? Math.round(list.reduce((s,p)=>s+computeProgress(p),0)/total) : 0;
  const late = list.filter(p=>{
    const d = daysUntil(p.endDate);
    return d!==null && d<0 && computeProgress(p)<100;
  }).length;
  document.getElementById('dash').innerHTML = `
    <div class="dcard"><div class="num">${total}</div><div class="lbl">진행 공사</div></div>
    <div class="dcard"><div class="num">${avg}%</div><div class="lbl">평균 공정률</div></div>
    <div class="dcard"><div class="num" style="color:${late>0?'var(--danger)':'var(--ink)'}">${late}</div><div class="lbl">기한 초과</div></div>
  `;
  document.getElementById('countLabel').textContent = total+'건';
}

function renderList(){
  const list = state.projects.filter(p=>p.company===state.company)
    .sort((a,b)=> (a.endDate||'9999').localeCompare(b.endDate||'9999'));
  const el = document.getElementById('list');
  if(list.length===0){
    el.innerHTML = `<div class="empty">등록된 공사가 없어요.<br>아래 '+ 공사 등록' 버튼으로 추가해 보세요.</div>`;
    return;
  }
  el.innerHTML = list.map(p=>{
    const dleft = daysUntil(p.endDate);
    const progressVal = computeProgress(p);
    const late = dleft!==null && dleft<0 && progressVal<100;
    const tagClass = p.company==='혜송산업개발' ? 'hyesong' : 'sinjin';
    let ddayText = '-';
    if(dleft!==null){
      ddayText = dleft===0 ? 'D-DAY' : (dleft>0 ? `D-${dleft}` : `${Math.abs(dleft)}일 초과`);
    }
    return `
    <div class="card" onclick="openDetail('${p.id}')">
      <div class="card-top">
        <div>
          <div class="card-title">${escapeHtml(p.name)}</div>
          <div class="card-loc">${escapeHtml(p.location||'위치 미입력')}</div>
        </div>
        <div class="tag ${tagClass}">${p.company}</div>
      </div>
      <div class="gauge">
        <div class="gauge-top">
          <div class="gauge-pct">${progressVal}%</div>
          <div class="gauge-period">${fmtDate(p.startDate)} ~ ${fmtDate(p.endDate)}</div>
        </div>
        <div class="ruler">
          <div class="ruler-fill ${late?'late':''}" style="width:${progressVal}%"></div>
          <div class="ruler-ticks">${'<div></div>'.repeat(10)}</div>
        </div>
      </div>
      <div class="status-row">
        <span>완료 일정 ${(p.milestones||[]).filter(m=>m.done).length}/${(p.milestones||[]).length}</span>
        <span class="dday ${late?'late':''}">${ddayText}</span>
      </div>
    </div>`;
  }).join('');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Add / Edit sheet ----
function openAdd(){
  editingId = null;
  document.getElementById('sheet').innerHTML = formTemplate({
    company: state.company, name:'', location:'', startDate:'', endDate:'', contractAmount:'', progress:0, memo:'', milestones:[]
  }, false);

function openDetail(id){

let editingLogId = null;

function getKnownNames(){
  const map = new Map();
  state.projects.forEach(pr=>{
    (pr.laborLogs||[]).forEach(l=>{
      if(l.name) map.set(l.name, { type:l.type, rate:l.rate||0 });
    });
  });
  return Array.from(map.entries()).map(([name,info])=>({name, type:info.type, rate:info.rate}));
}

function getKnownJobTypes(){
  const set = new Set(['조경공','보통인부','잔디공']);
  state.projects.forEach(pr=>{
    (pr.laborLogs||[]).forEach(l=>{ if(l.jobType) set.add(l.jobType); });
  });
  return Array.from(set);
}

function laborSectionHtml(p){
  const logs = (p.laborLogs||[]).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const totalPerson = logs.filter(l=>l.type==='인력').reduce((s,l)=>s+(Number(l.qty)||0),0);
  const totalEquip = logs.filter(l=>l.type==='장비').reduce((s,l)=>s+(Number(l.qty)||0),0);
  const totalCost = logs.reduce((s,l)=>s+(Number(l.amount)||0),0);
  const typeClass = {'인력':'person','장비':'equip','자재':'material','식대':'meal','잡자재':'misc'};
  const rows = logs.map(l=>{
    const qtyPart = l.qty ? `${l.qty}${l.unit||''}` : '';
    const ratePart = (l.rate && (l.type==='인력'||l.type==='장비')) ? `단가 ${formatWon(l.rate)}원` : '';
    const amountPart = l.amount ? formatWon(l.amount)+'원' : '';
    const mid = [qtyPart, ratePart, amountPart].filter(Boolean).join(' · ');
    const showTax = (l.type==='자재' || l.type==='잡자재') && l.amount;
    const taxBadge = showTax ? `<span class="tax-badge ${l.taxInvoice?'issued':'pending'}">${l.taxInvoice?'계산서 발행':'계산서 미발행'}</span>` : '';
    const workItem = l.workItemId ? (p.workItems||[]).find(w=>w.id===l.workItemId) : null;
    const workItemTag = workItem ? `<span style="color:var(--blueprint-light);">[${escapeHtml(workItem.name)}]</span> ` : '';
    return `
    <div class="lg-item">
      <div class="lg-type ${typeClass[l.type]||'misc'}">${l.type}</div>
      <div class="lg-body">
        <div class="lg-name">${workItemTag}${l.jobType ? escapeHtml(l.jobType)+' · ' : ''}${escapeHtml(l.name)}${mid ? ' · '+mid : ''}${taxBadge}</div>
        <div class="lg-sub" style="text-align:left;margin:0;">${fmtDate(l.date)}${l.note ? ' · '+escapeHtml(l.note) : ''}</div>
      </div>
      <div class="lg-edit" onclick="editLaborLog('${l.id}')">✎</div>
      <div class="lg-del" onclick="deleteLaborLog('${l.id}')">✕</div>
    </div>`;
  }).join('') || '<div style="font-size:12px;color:#a09a89;padding:6px 0;">투입 기록이 없어요.</div>';

  const editingLog = editingLogId ? (p.laborLogs||[]).find(l=>l.id===editingLogId) : null;
  const f = editingLog || {type:'인력', jobType:'', name:'', qty:1, unit:'공수', rate:'', amount:'', date:todayStr(), note:'', taxInvoice:false, workItemId:''};
  const isLaborType = (f.type==='인력' || f.type==='장비');
  const isPersonType = (f.type==='인력');
  const isMaterialType = (f.type==='자재' || f.type==='잡자재');
  const knownNames = getKnownNames();
  const knownJobTypes = getKnownJobTypes();

  return `
    <div class="ms-title">인력·장비·자재 투입 관리</div>
    <div class="lg-stats">
      <div class="lg-stat"><div class="n">${totalPerson}</div><div class="l">누적 인력(공수)</div></div>
      <div class="lg-stat"><div class="n">${totalEquip}</div><div class="l">누적 장비(공수)</div></div>
      <div class="lg-stat"><div class="n">${formatWon(totalCost)}</div><div class="l">누적 투입비용(원)</div></div>
    </div>
    <div id="lgList">${rows}</div>
    <datalist id="lg_name_options">
      ${knownNames.map(k=>`<option value="${escapeHtml(k.name)}">`).join('')}
    </datalist>
    <datalist id="lg_jobtype_options">
      ${knownJobTypes.map(j=>`<option value="${escapeHtml(j)}">`).join('')}
    </datalist>
    <div class="lg-add">
      <select id="lg_new_type" onchange="onLgTypeChange()">
        <option value="인력" ${f.type==='인력'?'selected':''}>인력</option>
        <option value="장비" ${f.type==='장비'?'selected':''}>장비</option>
        <option value="자재" ${f.type==='자재'?'selected':''}>자재(반입)</option>
        <option value="식대" ${f.type==='식대'?'selected':''}>식대</option>
        <option value="잡자재" ${f.type==='잡자재'?'selected':''}>잡자재비</option>
      </select>
      ${(p.workItems&&p.workItems.length>0) ? `
      <select id="lg_new_workitem" class="lg-workitem-select">
        <option value="">공종 선택안함</option>
        ${p.workItems.map(w=>`<option value="${w.id}" ${f.workItemId===w.id?'selected':''}>${escapeHtml(w.name)}</option>`).join('')}
      </select>
      ` : `<select id="lg_new_workitem" style="display:none;"><option value=""></option></select>`}
      <input id="lg_new_jobtype" class="lg-jobtype-input" type="text" list="lg_jobtype_options"
        placeholder="직종 (예: 조경공)" value="${escapeHtml(f.jobType||'')}" style="display:${isPersonType?'block':'none'};">
      <input id="lg_new_name" class="lg-name-input" type="text" list="lg_name_options"
        placeholder="이름 (예: 홍길동)" value="${escapeHtml(f.name)}" oninput="onLgNameInput()">
      <input id="lg_new_qty" type="number" step="0.5" placeholder="공수" min="0" value="${f.qty}" oninput="updateLgTotal()">
      <input id="lg_new_unit" class="lg-unit-input" type="text" placeholder="단위" value="${f.unit||''}">
      <input id="lg_new_rate" class="lg-rate-input" type="number" placeholder="단가(원)"
        value="${f.rate||''}" oninput="updateLgTotal()" style="display:${isLaborType?'block':'none'};">
      <input id="lg_new_amount" class="lg-amount-input" type="number" placeholder="금액(원)"
        value="${f.amount||''}" style="display:${isLaborType?'none':'block'};">
      <input id="lg_new_date" type="date" value="${f.date||todayStr()}">
      <input id="lg_new_note" class="lg-note-input" type="text" placeholder="비고 (선택)" value="${escapeHtml(f.note||'')}">
      <div class="lg-tax-row" id="lg_tax_row" style="display:${isMaterialType?'flex':'none'};">
        <input id="lg_new_tax" type="checkbox" ${f.taxInvoice?'checked':''}>
        <label for="lg_new_tax">세금계산서 발행됨 (자재비·운반비 등)</label>
      </div>
      <button onclick="submitLaborLog()">${editingLog?'수정 저장':'추가'}</button>
      ${editingLog?'<span class="lg-cancel" onclick="cancelLgEdit()">취소</span>':''}
    </div>
    <div class="lg-sum" id="lg_total_display" style="display:${isLaborType?'block':'none'};">
      합계: ${formatWon((Number(f.qty)||0)*(Number(f.rate)||0))}원
    </div>
  `;
}

function onLgNameInput(){
  const type = document.getElementById('lg_new_type').value;
  if(type!=='인력' && type!=='장비') return;
  const name = document.getElementById('lg_new_name').value.trim();
  const known = getKnownNames().find(k=>k.name===name && k.type===type);
  if(known && known.rate){
    document.getElementById('lg_new_rate').value = known.rate;
    updateLgTotal();
  }
}

function updateLgTotal(){
  const rateEl = document.getElementById('lg_new_rate');
  const totalEl = document.getElementById('lg_total_display');
  if(!rateEl || !totalEl) return;
  const qty = Number(document.getElementById('lg_new_qty').value) || 0;
  const rate = Number(rateEl.value) || 0;
  const total = qty*rate;
  totalEl.textContent = '합계: '+formatWon(total)+'원';
  const amountEl = document.getElementById('lg_new_amount');
  if(amountEl) amountEl.value = total;
}

function onLgTypeChange(){
  const type = document.getElementById('lg_new_type').value;
  const unitEl = document.getElementById('lg_new_unit');
  const nameEl = document.getElementById('lg_new_name');
  const qtyEl = document.getElementById('lg_new_qty');
  const rateEl = document.getElementById('lg_new_rate');
  const amountEl = document.getElementById('lg_new_amount');
  const totalEl = document.getElementById('lg_total_display');
  const jobtypeEl = document.getElementById('lg_new_jobtype');
  const taxRowEl = document.getElementById('lg_tax_row');
  const isLaborType = (type==='인력' || type==='장비');
  const isPersonType = (type==='인력');
  const isMaterialType = (type==='자재' || type==='잡자재');
  const defaults = {'인력':'공수','장비':'공수','자재':'개','식대':'건','잡자재':'건'};
  const namePlaceholders = {
    '인력':'이름 (예: 홍길동)',
    '장비':'장비명 (예: 굴삭기 0.6)',
    '자재':'자재명 (예: 마사토)',
    '식대':'항목 (예: 점심식사)',
    '잡자재':'항목 (예: 소모품)'
  };
  unitEl.value = defaults[type] || '';
  nameEl.placeholder = namePlaceholders[type] || '항목명';
  qtyEl.placeholder = isLaborType ? '공수' : '수량';
  rateEl.style.display = isLaborType ? 'block' : 'none';
  amountEl.style.display = isLaborType ? 'none' : 'block';
  totalEl.style.display = isLaborType ? 'block' : 'none';
  jobtypeEl.style.display = isPersonType ? 'block' : 'none';
  if(!isPersonType) jobtypeEl.value = '';
  taxRowEl.style.display = isMaterialType ? 'flex' : 'none';
  if(isLaborType){ updateLgTotal(); }
}

function submitLaborLog(){
  const type = document.getElementById('lg_new_type').value;
  const jobType = (type==='인력') ? document.getElementById('lg_new_jobtype').value.trim() : '';
  const name = document.getElementById('lg_new_name').value.trim();
  const qty = Number(document.getElementById('lg_new_qty').value) || 0;
  const unit = document.getElementById('lg_new_unit').value.trim();
  const rate = Number(document.getElementById('lg_new_rate').value) || 0;
  const isLaborType = (type==='인력' || type==='장비');
  const amount = isLaborType ? qty*rate : (Number(document.getElementById('lg_new_amount').value) || 0);
  const date = document.getElementById('lg_new_date').value || todayStr();
  const note = document.getElementById('lg_new_note').value.trim();
  const isMaterialType = (type==='자재' || type==='잡자재');
  const taxInvoice = isMaterialType ? document.getElementById('lg_new_tax').checked : false;
  const workItemId = document.getElementById('lg_new_workitem').value || '';
  if(!name){ alert('이름/항목명을 입력해주세요.'); return; }
  if(qty<=0 && amount<=0){ alert('공수(수량) 또는 금액 중 하나는 입력해주세요.'); return; }
  const p = state.projects.find(x=>x.id===editingId);
  p.laborLogs = p.laborLogs || [];
  if(editingLogId){
    const log = p.laborLogs.find(x=>x.id===editingLogId);
    Object.assign(log, {type, jobType, name, qty, unit, rate, amount, date, note, taxInvoice, workItemId});
  } else {
    p.laborLogs.push({id:uid(), type, jobType, name, qty, unit, rate, amount, date, note, taxInvoice, workItemId});
  }
  editingLogId = null;
  saveProjects();
  document.getElementById('sheet').innerHTML = formTemplate(p, true);
  render();
}

function editLaborLog(logId){
  editingLogId = logId;
  const p = state.projects.find(x=>x.id===editingId);
  document.getElementById('sheet').innerHTML = formTemplate(p, true);
}

function cancelLgEdit(){
  editingLogId = null;
  const p = state.projects.find(x=>x.id===editingId);
  document.getElementById('sheet').innerHTML = formTemplate(p, true);
}

function deleteLaborLog(logId){
  const p = state.projects.find(x=>x.id===editingId);
  p.laborLogs = p.laborLogs.filter(x=>x.id!==logId);
  if(editingLogId===logId) editingLogId = null;
  saveProjects();
  document.getElementById('sheet').innerHTML = formTemplate(p, true);
  render();
}

// ---- 투입비용 기준 공정률 자동계산 ----
function totalInvestedCost(p){
  return (p.laborLogs||[]).reduce((s,l)=>s+(Number(l.amount)||0), 0);
}

function autoProgressEnabled(p){
  return Number(p.contractAmount) > 0;
}

function computeProgress(p){
  if(!autoProgressEnabled(p)) return Number(p.progress)||0;
  const invested = totalInvestedCost(p);
  const pct = Math.round((invested / Number(p.contractAmount)) * 100);
  return Math.max(0, Math.min(100, pct));
}

// ---- 착공내역서(공종별 예산) & 공종별 진행률 ----
function getWorkItemProgress(p, itemId){
  const invested = (p.laborLogs||[]).filter(l=>l.workItemId===itemId).reduce((s,l)=>s+(Number(l.amount)||0),0);
  const item = (p.workItems||[]).find(w=>w.id===itemId);
  const budget = item ? Number(item.amount)||0 : 0;
  const pct = budget>0 ? Math.round((invested/budget)*100) : 0;
  return {invested, budget, pct};
}

function workItemsSectionHtml(p){
  p.workItems = p.workItems || [];

  const body = p.workItems.length===0 ? `
    <div class="wi-empty">아직 착공내역서가 등록되지 않았어요. 엑셀 파일(공종·수량·단가·금액 포함)을 업로드하면, 아래 인력·장비·자재 투입 시 공종을 선택할 수 있고 공종별 진행률이 자동으로 계산돼요.</div>
    <button class="wi-upload-btn" onclick="triggerWorkItemsUpload()">📁 착공내역서 엑셀 업로드</button>
  ` : `
    <div class="wi-summary">착공내역서 합계: <b>${formatWon(p.workItemsTotal||0)}원</b> · 공종 <b>${p.workItems.length}개</b>${p.workItemsFileName?' · '+escapeHtml(p.workItemsFileName):''}</div>
    <button class="wi-upload-btn" onclick="triggerWorkItemsUpload()">📁 다시 업로드</button>
    <div style="margin-top:10px;">
      ${p.workItems.map(w=>{
        const prog = getWorkItemProgress(p, w.id);
        return `
        <div class="wi-item">
          <div class="wi-item-top">
            <div class="wi-item-name">${escapeHtml(w.name)}${w.spec?' ('+escapeHtml(w.spec)+')':''}</div>
            <div class="wi-item-pct">${prog.pct}%</div>
          </div>
          <div class="wi-bar"><div class="wi-bar-fill ${prog.pct>100?'over':''}" style="width:${Math.min(100,prog.pct)}%"></div></div>
          <div class="wi-item-sub">투입 ${formatWon(prog.invested)}원 / 예산 ${formatWon(prog.budget)}원</div>
        </div>`;
      }).join('')}
    </div>
  `;

  return `
    <div class="ms-title">착공내역서 · 공종별 진행률</div>
    <div class="wi-box">${body}</div>
    <input type="file" id="workitems_file_input" accept=".xlsx,.xls" style="display:none;" onchange="handleWorkItemsUpload(event)">
  `;
}

function triggerWorkItemsUpload(){
  document.getElementById('workitems_file_input').click();
}

function handleWorkItemsUpload(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const parsed = parseWorkItemsWorkbook(wb);
      if(parsed.items.length===0){
        alert('엑셀에서 공종 항목을 찾지 못했어요. 공종·수량·단가·금액이 포함된 표 형식인지 확인해주세요.');
        return;
      }
      const p = state.projects.find(x=>x.id===editingId);
      p.workItems = parsed.items;
      p.workItemsTotal = parsed.total;
      p.workItemsFileName = file.name;
      if(!p.contractAmount || Number(p.contractAmount)<=0){ p.contractAmount = parsed.total; }
      saveProjects();
      document.getElementById('sheet').innerHTML = formTemplate(p, true);
      render();
    }catch(err){
      alert('엑셀 파일을 읽는 중 문제가 발생했어요. 파일 형식을 확인해주세요.');
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseWorkItemsWorkbook(wb){
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
  const nameKeys = ['공종','품명','항목','명칭','품목'];
  const specKeys = ['규격','규격/모델','사양'];
  const unitKeys = ['단위'];
  const qtyKeys = ['수량'];
  const priceKeys = ['단가'];
  const amountKeys = ['금액','합계금액','공급가액'];
  const skipNameKeys = ['합계','소계','계','총계','비고'];

  let headerRowIdx = -1, cols = {};
  for(let i=0;i<Math.min(aoa.length,15);i++){
    const row = aoa[i].map(c=>String(c||'').trim());
    const findCol = (keys)=> row.findIndex(cell=> keys.some(k=>cell.includes(k)));
    const nameIdx = findCol(nameKeys);
    const amountIdx = findCol(amountKeys);
    const qtyIdx = findCol(qtyKeys);
    if(nameIdx>=0 && (amountIdx>=0 || qtyIdx>=0)){
      headerRowIdx = i;
      cols = { name: nameIdx, spec: findCol(specKeys), unit: findCol(unitKeys), qty: qtyIdx, price: findCol(priceKeys), amount: amountIdx };
      break;
    }
  }
  if(headerRowIdx===-1) return {items:[], total:0};

  const items = [];
  let total = 0;
  for(let i=headerRowIdx+1; i<aoa.length; i++){
    const row = aoa[i];
    if(!row || row.length===0) continue;
    const rawName = String(row[cols.name]||'').trim();
    if(!rawName) continue;
    if(skipNameKeys.some(k=>rawName===k || rawName.includes(k))) continue;
    const qty = cols.qty>=0 ? Number(String(row[cols.qty]).replace(/,/g,'')) || 0 : 0;
    const unitPrice = cols.price>=0 ? Number(String(row[cols.price]).replace(/,/g,'')) || 0 : 0;
    let amount = cols.amount>=0 ? Number(String(row[cols.amount]).replace(/,/g,'')) || 0 : 0;
    if(!amount && qty && unitPrice) amount = qty*unitPrice;
    if(!amount) continue;
    items.push({
      id: uid(),
      name: rawName,
      spec: cols.spec>=0 ? String(row[cols.spec]||'').trim() : '',
      unit: cols.unit>=0 ? String(row[cols.unit]||'').trim() : '',
      qty, unitPrice, amount
    });
    total += amount;
  }
  return {items, total};
}


function saveForm(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert('공사명을 입력해주세요.'); return; }
  const progressEl = document.getElementById('f_progress');
  const existing = editingId ? state.projects.find(x=>x.id===editingId) : null;
  const data = {
    company: document.getElementById('f_company').value,
    name,
    location: document.getElementById('f_location').value.trim(),
    startDate: document.getElementById('f_start').value,
    endDate: document.getElementById('f_end').value,
    contractAmount: document.getElementById('f_amount').value,
    progress: progressEl ? Number(progressEl.value) : (existing ? Number(existing.progress)||0 : 0),
    memo: document.getElementById('f_memo').value.trim(),
  };
  if(editingId){
    const p = state.projects.find(x=>x.id===editingId);
    Object.assign(p, data);
  } else {
    data.id = uid();
    data.milestones = [];
    data.laborLogs = [];
    data.boq = [];
    data.boqTotal = 0;
    data.dailyReports = [];
    state.projects.push(data);
  }
  saveProjects();
  state.company = data.company;
  closeSheet();
  render();
}

function deleteProject(){
  if(!confirm('이 공사를 삭제할까요? 되돌릴 수 없어요.')) return;
  state.projects = state.projects.filter(x=>x.id!==editingId);
  saveProjects();
  closeSheet();
  render();
}

function addMilestone(){
  const title = document.getElementById('ms_new_title').value.trim();
  const date = document.getElementById('ms_new_date').value;
  if(!title){ return; }
  const p = state.projects.find(x=>x.id===editingId);
  p.milestones = p.milestones || [];
  p.milestones.push({id:uid(), title, date, done:false});
  saveProjects();
  document.getElementById('sheet').innerHTML = formTemplate(p, true);
}

function toggleMilestone(msId){
  const p = state.projects.find(x=>x.id===editingId);
  const m = p.milestones.find(x=>x.id===msId);
  m.done = !m.done;
  saveProjects();
  document.getElementById('sheet').innerHTML = formTemplate(p, true);
  render();
}

function deleteMilestone(msId){
  const p = state.projects.find(x=>x.id===editingId);
  p.milestones = p.milestones.filter(x=>x.id!==msId);
  saveProjects();
  document.getElementById('sheet').innerHTML = formTemplate(p, true);
  render();
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{ state.company = t.dataset.c; render(); });
});
document.getElementById('addBtn').addEventListener('click', openAdd);
document.getElementById('exportBtn').addEventListener('click', exportMonthlyExcel);
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeSheet();
});

function exportMonthlyExcel(){
  const list = state.projects.filter(p=>p.company===state.company);
  if(list.length===0 || list.every(p=>(p.laborLogs||[]).length===0)){
    alert('집계할 인력·장비 투입 기록이 없어요.');
    return;
  }

  // monthKey -> projectId -> {name, pGongsu, pCost, eGongsu, eCost}
  const monthly = {};
  list.forEach(p=>{
    (p.laborLogs||[]).forEach(l=>{
      if(l.type!=='인력' && l.type!=='장비') return;
      const month = (l.date||'').slice(0,7) || '날짜미상';
      if(!monthly[month]) monthly[month] = {};
      if(!monthly[month][p.id]) monthly[month][p.id] = {name:p.name, pGongsu:0, pCost:0, eGongsu:0, eCost:0};
      const row = monthly[month][p.id];
      const qty = Number(l.qty)||0;
      const cost = Number(l.amount)||0;
      if(l.type==='인력'){ row.pGongsu += qty; row.pCost += cost; }
      else { row.eGongsu += qty; row.eCost += cost; }
    });
  });

  const months = Object.keys(monthly).sort();
  const rows = [];
  rows.push(['월','현장명','인력 공수','인력 비용(원)','장비 공수','장비 비용(원)','합계 비용(원)']);

  let grand = {pGongsu:0, pCost:0, eGongsu:0, eCost:0};

  months.forEach(month=>{
    const projRows = Object.values(monthly[month]).sort((a,b)=>a.name.localeCompare(b.name));
    let sub = {pGongsu:0, pCost:0, eGongsu:0, eCost:0};
    projRows.forEach(r=>{
      rows.push([month, r.name, r.pGongsu, r.pCost, r.eGongsu, r.eCost, r.pCost+r.eCost]);
      sub.pGongsu += r.pGongsu; sub.pCost += r.pCost; sub.eGongsu += r.eGongsu; sub.eCost += r.eCost;
    });
    rows.push([month, '소계(전체 현장)', sub.pGongsu, sub.pCost, sub.eGongsu, sub.eCost, sub.pCost+sub.eCost]);
    rows.push([]);
    grand.pGongsu += sub.pGongsu; grand.pCost += sub.pCost; grand.eGongsu += sub.eGongsu; grand.eCost += sub.eCost;
  });

  rows.push(['총 합계','전체 기간 · 전체 현장', grand.pGongsu, grand.pCost, grand.eGongsu, grand.eCost, grand.pCost+grand.eCost]);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:10},{wch:22},{wch:10},{wch:14},{wch:10},{wch:14},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '월별집계');
  XLSX.writeFile(wb, `${state.company}_인력장비_월별집계_${todayStr()}.xlsx`);
}
